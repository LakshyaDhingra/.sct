name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck:tsc
      - run: bun run test
      - run: bun run test:ui
      - uses: millionco/react-doctor@main
        with:
          scope: full
          blocking: error
          comment: 'false'
          review-comments: 'false'
          commit-status: 'false'
